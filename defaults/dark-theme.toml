#:schema ../extra/schemas/color-theme.json

[color-theme]
name = "AHEAD Dark"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 50
scroll-width = 10
drop-shadow-width = 0

[color-theme.base]
brand = "#5DAE6D"
brand-soft = "#A7D6A1"
brand-deep = "#4CA15D"
input-border = "#5E7464"
popup-background = "#1B231E"
black = "#1B231E"
blue = "#8ABCD9"
cyan = "#76C5D5"
green = "#5DAE6D"
grey = "#405346"
magenta = "#C8A8DF"
orange = "#DDB18A"
purple = "#C3A0DD"
red = "#EB8FA8"
white = "#E0E8DF"
yellow = "#D6B66D"

primary-background = "#101512"
# Background for 'secondary' elements: panels, palette, status bar, completion, hover
secondary-background = "#0C100E"
current-background = "#202B23"
text = "$white"
dim-text = "#91A395"

[color-theme.syntax]
"boolean" = "$orange"
"operator" = "$text"
"punctuation" = "$text"
"comment" = "$dim-text"
"constant" = "$yellow"
"type" = "$cyan"
"typeAlias" = "$cyan"
"number" = "$orange"
"enum" = "$cyan"
"struct" = "$cyan"
"structure" = "$cyan"
"interface" = "$cyan"
"attribute" = "$yellow"
"constructor" = "$cyan"
"function" = "#5DAE6D"
"method" = "#5DAE6D"
"function.method" = "#5DAE6D"
"keyword" = "$purple"
"selfKeyword" = "$purple"
"field" = "$text"
"property" = "$text"
"enumMember" = "$red"
"enum-member" = "$red"
"string" = "$brand-soft"
"type.builtin" = "$cyan"
"builtinType" = "$cyan"
"escape" = "$cyan"
"string.escape" = "$cyan"
"embedded" = "$cyan"
"punctuation.delimiter" = "$text"
"text.title" = "$orange"
"text.uri" = "$cyan"
"text.reference" = "$yellow"
"variable" = "$text"
"variable.other.member" = "$text"
"tag" = "#5DAE6D"

"markup.heading" = "$red"
"markup.bold" = "$orange"
"markup.italic" = "$orange"
"markup.list" = "$orange"
"markup.link.url" = "#5DAE6D"
"markup.link.label" = "$purple"
"markup.link.text" = "$purple"

"bracket.color.1" = "#5DAE6D"
"bracket.color.2" = "$yellow"
"bracket.color.3" = "$purple"
"bracket.unpaired" = "$red"

[color-theme.ui]
"ahead.error" = "$red"
"ahead.warn" = "$yellow"
"ahead.dropdown_shadow" = "#000000"
"ahead.border" = "#33463A"
"ahead.scroll_bar" = "#5DAE6D44"

"ahead.button.primary.background" = "#5DAE6D"
"ahead.button.primary.foreground" = "#101512"
"ahead.button.primary.hover" = "#75BA82"
"ahead.button.primary.active" = "$brand-deep"

# tab
"ahead.tab.active.background" = "$primary-background"
"ahead.tab.active.foreground" = "$text"
"ahead.tab.active.underline" = "#5DAE6D"

"ahead.tab.inactive.background" = "$secondary-background"
"ahead.tab.inactive.foreground" = "$dim-text"
"ahead.tab.inactive.underline" = "#5DAE6D44"

"ahead.tab.separator" = ""

"ahead.icon.active" = "#5DAE6D"
"ahead.icon.inactive" = "$dim-text"

"ahead.remote.icon" = "#101512"
"ahead.remote.local" = "#5DAE6D"
"ahead.remote.connected" = "#5DAE6D"
"ahead.remote.connecting" = "#D6B66D"
"ahead.remote.disconnected" = "#EB8FA8"

"ahead.plugin.name" = "#F0F5ED"
"ahead.plugin.description" = "$text"
"ahead.plugin.author" = "#A7B7AB"

"editor.background" = "$primary-background"
"editor.foreground" = "$text"
"editor.dim" = "$dim-text"
"editor.focus" = "#5DAE6D"
"editor.caret" = "#5DAE6D"
"editor.selection" = "#5DAE6D33"
"editor.current_line" = "#1D2921"
"editor.debug_break_line" = "#5DAE6D37"
"editor.link" = "#5DAE6D"
"editor.visible_whitespace" = "#405346"
"editor.indent_guide" = "#2D3E32"
"editor.drag_drop_background" = "#5DAE6D33"
"editor.drag_drop_tab_background" = "#304D3633"
"editor.sticky_header_background" = "$primary-background"

"inlay_hint.foreground" = "#A7D6A1"
"inlay_hint.background" = "#304D3644"

"error_lens.error.foreground" = "$red"
"error_lens.error.background" = "#EB8FA820"
"error_lens.warning.foreground" = "$yellow"
"error_lens.warning.background" = "#D6B66D20"
"error_lens.other.foreground" = "$dim-text"
"error_lens.other.background" = "#91A39520"

"completion_lens.foreground" = "$dim-text"

"source_control.added" = "#5DAE6DCC"
"source_control.removed" = "#EB8FA8CC"
"source_control.modified" = "#D6B66DCC"

"tooltip.background" = "$primary-background"
"tooltip.foreground" = "$text"

"palette.background" = "$secondary-background"
"palette.foreground" = "$text"
"palette.current.background" = "#294431"
"palette.current.foreground" = "$text"

"completion.background" = "$secondary-background"
"completion.current" = "#294431"

"hover.background" = "$secondary-background"

"activity.background" = "$secondary-background"
"activity.current" = "$primary-background"

"debug.breakpoint" = "$red"
"debug.breakpoint.hover" = "#EB8FA866"

"panel.background" = "$secondary-background"
"panel.foreground" = "$text"
"panel.foreground.dim" = "$dim-text"
"panel.current.background" = "#294431"
"panel.current.foreground" = "$text"
"panel.current.foreground.dim" = "$dim-text"
"panel.hovered.background" = "#2D3E32"
"panel.hovered.active.background" = "$current-background"
"panel.hovered.foreground" = "$text"
"panel.hovered.foreground.dim" = "$dim-text"

"status.background" = "$secondary-background"
"status.foreground" = "$text"
"status.modal.normal.background" = "#5DAE6D"
"status.modal.normal.foreground" = "#101512"
"status.modal.insert.background" = "#EB8FA8"
"status.modal.insert.foreground" = "#101512"
"status.modal.visual.background" = "#D6B66D"
"status.modal.visual.foreground" = "#101512"
"status.modal.terminal.background" = "#C3A0DD"
"status.modal.terminal.foreground" = "#101512"

"markdown.blockquote" = "#91A395"

"terminal.cursor" = "#5DAE6D"
"terminal.foreground" = "$text"
"terminal.background" = "$primary-background"
"terminal.white" = "$white"
"terminal.black" = "$black"
"terminal.red" = "$red"
"terminal.blue" = "$blue"
"terminal.green" = "$green"
"terminal.yellow" = "$yellow"
"terminal.cyan" = "$cyan"
"terminal.magenta" = "$magenta"
"terminal.bright_white" = "#F5F9F1"
"terminal.bright_red" = "$red"
"terminal.bright_blue" = "$blue"
"terminal.bright_green" = "#5DAE6D"
"terminal.bright_yellow" = "$yellow"
"terminal.bright_cyan" = "$cyan"
"terminal.bright_magenta" = "$magenta"
"terminal.bright_black" = "#86998B"

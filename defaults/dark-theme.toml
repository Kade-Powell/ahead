#:schema ../extra/schemas/color-theme.json

[color-theme]
name = "AHEAD Dark"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 50
scroll-width = 10
drop-shadow-width = 0

[color-theme.base]
black = "#181E24"
blue = "#38BDF8"
cyan = "#2DD4BF"
green = "#10B981"
grey = "#2E3842"
magenta = "#C084FC"
orange = "#FB923C"
purple = "#A78BFA"
red = "#F87171"
white = "#E2E8F0"
yellow = "#FBBF24"

primary-background = "#13181E"
# Background for 'secondary' elements: panels, palette, status bar, completion, hover
secondary-background = "#0F1318"
current-background = "#1D2530"
text = "$white"
dim-text = "#64748B"

[color-theme.syntax]
"comment" = "$dim-text"
"constant" = "$yellow"
"type" = "$yellow"
"typeAlias" = "$yellow"
"number" = "$yellow"
"enum" = "$yellow"
"struct" = "$yellow"
"structure" = "$yellow"
"interface" = "$yellow"
"attribute" = "$yellow"
"constructor" = "$yellow"
"function" = "#34D399"
"method" = "#34D399"
"function.method" = "#34D399"
"keyword" = "$purple"
"selfKeyword" = "$purple"
"field" = "$red"
"property" = "$red"
"enumMember" = "$red"
"enum-member" = "$red"
"string" = "$green"
"type.builtin" = "$cyan"
"builtinType" = "$cyan"
"escape" = "$cyan"
"string.escape" = "$cyan"
"embedded" = "$cyan"
"punctuation.delimiter" = "$yellow"
"text.title" = "$orange"
"text.uri" = "$cyan"
"text.reference" = "$yellow"
"variable" = "$red"
"variable.other.member" = "$red"
"tag" = "#34D399"

"markup.heading" = "$red"
"markup.bold" = "$orange"
"markup.italic" = "$orange"
"markup.list" = "$orange"
"markup.link.url" = "#34D399"
"markup.link.label" = "$purple"
"markup.link.text" = "$purple"

"bracket.color.1" = "#10B981"
"bracket.color.2" = "$yellow"
"bracket.color.3" = "$purple"
"bracket.unpaired" = "$red"

[color-theme.ui]
"lapce.error" = "$red"
"lapce.warn" = "$yellow"
"lapce.dropdown_shadow" = "#000000"
"lapce.border" = "#1E293B"
"lapce.scroll_bar" = "#10B98144"

"lapce.button.primary.background" = "#10B981"
"lapce.button.primary.foreground" = "#06281E"

# tab
"lapce.tab.active.background" = "$primary-background"
"lapce.tab.active.foreground" = "$text"
"lapce.tab.active.underline" = "#10B981"

"lapce.tab.inactive.background" = "$secondary-background"
"lapce.tab.inactive.foreground" = "$dim-text"
"lapce.tab.inactive.underline" = "#10B98144"

"lapce.tab.separator" = ""

"lapce.icon.active" = "#34D399"
"lapce.icon.inactive" = "$dim-text"

"lapce.remote.icon" = "#06281E"
"lapce.remote.local" = "#10B981"
"lapce.remote.connected" = "#10B981"
"lapce.remote.connecting" = "#F59E0B"
"lapce.remote.disconnected" = "#EF4444"

"lapce.plugin.name" = "#F1F5F9"
"lapce.plugin.description" = "$text"
"lapce.plugin.author" = "#94A3B8"

"editor.background" = "$primary-background"
"editor.foreground" = "$text"
"editor.dim" = "$dim-text"
"editor.focus" = "#10B981"
"editor.caret" = "#10B981"
"editor.selection" = "#133E2F"
"editor.current_line" = "#182229"
"editor.debug_break_line" = "#10B98137"
"editor.link" = "#34D399"
"editor.visible_whitespace" = "#2E3842"
"editor.indent_guide" = "#1F2937"
"editor.drag_drop_background" = "#10B98133"
"editor.drag_drop_tab_background" = "#064E3B33"
"editor.sticky_header_background" = "$primary-background"

"inlay_hint.foreground" = "#A7F3D0"
"inlay_hint.background" = "#064E3B44"

"error_lens.error.foreground" = "$red"
"error_lens.error.background" = "#F8717120"
"error_lens.warning.foreground" = "$yellow"
"error_lens.warning.background" = "#FBBF2420"
"error_lens.other.foreground" = "$dim-text"
"error_lens.other.background" = "#64748B20"

"completion_lens.foreground" = "$dim-text"

"source_control.added" = "#10B981CC"
"source_control.removed" = "#EF4444CC"
"source_control.modified" = "#F59E0BCC"

"tooltip.background" = "$primary-background"
"tooltip.foreground" = "$text"

"palette.background" = "$secondary-background"
"palette.foreground" = "$text"
"palette.current.background" = "#133E2F"
"palette.current.foreground" = "$text"

"completion.background" = "$secondary-background"
"completion.current" = "#133E2F"

"hover.background" = "$secondary-background"

"activity.background" = "$secondary-background"
"activity.current" = "$primary-background"

"debug.breakpoint" = "$red"
"debug.breakpoint.hover" = "#F8717166"

"panel.background" = "$secondary-background"
"panel.foreground" = "$text"
"panel.foreground.dim" = "$dim-text"
"panel.current.background" = "#133E2F"
"panel.current.foreground" = "$text"
"panel.current.foreground.dim" = "$dim-text"
"panel.hovered.background" = "#1F2937"
"panel.hovered.active.background" = "#133E2F"
"panel.hovered.foreground" = "$text"
"panel.hovered.foreground.dim" = "$dim-text"

"status.background" = "$secondary-background"
"status.foreground" = "$text"
"status.modal.normal.background" = "#10B981"
"status.modal.normal.foreground" = "#06281E"
"status.modal.insert.background" = "#F87171"
"status.modal.insert.foreground" = "#06281E"
"status.modal.visual.background" = "#FBBF24"
"status.modal.visual.foreground" = "#06281E"
"status.modal.terminal.background" = "#A78BFA"
"status.modal.terminal.foreground" = "#06281E"

"markdown.blockquote" = "#64748B"

"terminal.cursor" = "#10B981"
"terminal.foreground" = "$text"
"terminal.background" = "$primary-background"
"terminal.white" = "$white"
"terminal.black" = "$black"
"terminal.red" = "$red"
"terminal.blue" = "$blue"
"terminal.green" = "$green"
"terminal.yellow" = "$yellow"
"terminal.cyan" = "$cyan"
"terminal.magenta" = "$magenta"
"terminal.bright_white" = "#F8FAFC"
"terminal.bright_red" = "$red"
"terminal.bright_blue" = "$blue"
"terminal.bright_green" = "#34D399"
"terminal.bright_yellow" = "$yellow"
"terminal.bright_cyan" = "$cyan"
"terminal.bright_magenta" = "$magenta"
"terminal.bright_black" = "#475569"


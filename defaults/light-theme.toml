#:schema ../extra/schemas/color-theme.json

[color-theme]
name = "AHEAD Light"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 50
scroll-width = 10
drop-shadow-width = 0

[color-theme.base]
brand = "#5DAE6D"
brand-soft = "#A7D6A1"
brand-deep = "#4CA15D"
input-border = "#7F947F"
popup-background = "#FFFFFF"
black = "#233329"
blue = "#2C6487"
cyan = "#176F83"
green = "#2F713F"
grey = "#D4DFD0"
magenta = "#794C99"
orange = "#8B592D"
purple = "#794C99"
red = "#AB2854"
white = "#F7FAF6"
yellow = "#856011"

primary-background = "$white"
# Background for 'secondary' elements: panels, palette, status bar, completion, hover
secondary-background = "#EFF4ED"
current-background = "#DCEAD8"
text = "$black"
dim-text = "#526958"

[color-theme.syntax]
"boolean" = "$orange"
"operator" = "$text"
"punctuation" = "$text"
"comment" = "$dim-text"
"constant" = "$yellow"
"type" = "$cyan"
"typeAlias" = "$cyan"
"number" = "$orange"
"enum" = "$cyan"
"struct" = "$cyan"
"structure" = "$cyan"
"interface" = "$cyan"
"attribute" = "$yellow"
"constructor" = "$cyan"

"function" = "#2F713F"
"method" = "#2F713F"
"function.method" = "#2F713F"

"keyword" = "$purple"
"selfKeyword" = "$purple"

"field" = "$text"
"property" = "$text"
"enumMember" = "$red"
"enum-member" = "$red"

"string" = "#3F714A"
"string.escape" = "$cyan"

"type.builtin" = "$cyan"
"builtinType" = "$cyan"
"escape" = "$cyan"
"embedded" = "$cyan"

"punctuation.delimiter" = "$text"
"text.title" = "$orange"
"text.uri" = "$cyan"
"text.reference" = "$yellow"
"variable" = "$text"
"variable.other.member" = "$text"
"tag" = "#2F713F"

"markup.heading" = "$red"
"markup.bold" = "$orange"
"markup.italic" = "$orange"
"markup.list" = "$orange"
"markup.link.url" = "#2F713F"
"markup.link.label" = "$purple"
"markup.link.text" = "$purple"

"bracket.color.1" = "#2F713F"
"bracket.color.2" = "$yellow"
"bracket.color.3" = "$purple"
"bracket.unpaired" = "$red"

[color-theme.ui]
"ahead.error" = "#AB2854"
"ahead.warn" = "#856011"
"ahead.dropdown_shadow" = "#C2D0BD"
"ahead.border" = "#C2D0BD"
"ahead.scroll_bar" = "#2F713F44"

"ahead.button.primary.background" = "#2F713F"
"ahead.button.primary.foreground" = "$white"
"ahead.button.primary.hover" = "#285F35"
"ahead.button.primary.active" = "#234F2D"

# tab
"ahead.tab.active.background" = "$primary-background"
"ahead.tab.active.foreground" = "$text"
"ahead.tab.active.underline" = "#2F713F"

"ahead.tab.inactive.background" = "#EFF4ED"
"ahead.tab.inactive.foreground" = "$text"
"ahead.tab.inactive.underline" = "#2F713F44"

"ahead.tab.separator" = "#C2D0BD"

"ahead.icon.active" = "#2F713F"
"ahead.icon.inactive" = "$dim-text"

"ahead.remote.icon" = "$white"
"ahead.remote.local" = "#2F713F"
"ahead.remote.connected" = "#2F713F"
"ahead.remote.connecting" = "#856011"
"ahead.remote.disconnected" = "#AB2854"

"ahead.plugin.name" = "#233329"
"ahead.plugin.description" = "$text"
"ahead.plugin.author" = "#566D5C"

"terminal.cursor" = "$text"
"terminal.foreground" = "$text"
"terminal.background" = "$primary-background"
"terminal.white" = "$white"
"terminal.black" = "$black"
"terminal.red" = "$red"
"terminal.blue" = "$blue"
"terminal.green" = "$green"
"terminal.yellow" = "$yellow"
"terminal.cyan" = "$cyan"
"terminal.magenta" = "$magenta"
"terminal.bright_white" = "#1D2A21"
"terminal.bright_red" = "$red"
"terminal.bright_blue" = "$blue"
"terminal.bright_green" = "$green"
"terminal.bright_yellow" = "$yellow"
"terminal.bright_cyan" = "$cyan"
"terminal.bright_magenta" = "$magenta"
"terminal.bright_black" = "#566D5C"

"editor.background" = "$primary-background"
"editor.foreground" = "$text"
"editor.dim" = "$dim-text"
"editor.focus" = "#2F713F"
"editor.caret" = "#2F713F"
"editor.selection" = "#A7D6A14D"
"editor.current_line" = "#EDF4E9"
"editor.debug_break_line" = "#2F713F33"
"editor.link" = "#2F713F"
"editor.visible_whitespace" = "$grey"
"editor.indent_guide" = "$grey"
"editor.drag_drop_background" = "#2F713F33"
"editor.drag_drop_tab_background" = "#234F2D22"
"editor.sticky_header_background" = "$primary-background"

"inlay_hint.foreground" = "#2F713F"
"inlay_hint.background" = "#4CA15D22"

"error_lens.error.foreground" = "$red"
"error_lens.error.background" = "#AB285420"
"error_lens.warning.foreground" = "$yellow"
"error_lens.warning.background" = "#85601120"
"error_lens.other.foreground" = "$dim-text"
"error_lens.other.background" = "#566D5C20"

"completion_lens.foreground" = "$dim-text"

"source_control.added" = "#2F713FCC"
"source_control.removed" = "#AB2854CC"
"source_control.modified" = "#856011CC"

"tooltip.background" = "$primary-background"
"tooltip.foreground" = "$text"

"palette.background" = "$secondary-background"
"palette.foreground" = "$text"
"palette.current.background" = "$current-background"
"palette.current.foreground" = "$text"

"completion.background" = "$secondary-background"
"completion.current" = "$current-background"

"hover.background" = "$secondary-background"

"activity.background" = "$secondary-background"
"activity.current" = "$primary-background"

"debug.breakpoint" = "$red"
"debug.breakpoint.hover" = "#AB285466"

"panel.background" = "$secondary-background"
"panel.foreground" = "$text"
"panel.foreground.dim" = "$dim-text"
"panel.current.background" = "$current-background"
"panel.current.foreground" = "$text"
"panel.current.foreground.dim" = "$dim-text"
"panel.hovered.background" = "#E3EDDE"
"panel.hovered.active.background" = "$current-background"
"panel.hovered.foreground" = "$text"
"panel.hovered.foreground.dim" = "$dim-text"

"status.background" = "$secondary-background"
"status.foreground" = "$text"
"status.modal.normal.background" = "#2F713F"
"status.modal.normal.foreground" = "$white"
"status.modal.insert.background" = "$red"
"status.modal.insert.foreground" = "$white"
"status.modal.visual.background" = "$yellow"
"status.modal.visual.foreground" = "$white"
"status.modal.terminal.background" = "$purple"
"status.modal.terminal.foreground" = "$white"

"markdown.blockquote" = "#566D5C"

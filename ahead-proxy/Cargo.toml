[package]
name         = "ahead-proxy"
license      = { workspace = true }
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }

[features]
test-support = ["ahead-agent/test-support"]

[dependencies]
alacritty_terminal = { workspace = true }
anyhow             = { workspace = true }
base64             = { workspace = true }
clap               = { workspace = true }
chrono             = { workspace = true }
crossbeam-channel  = { workspace = true }
directories        = { workspace = true }
git2               = { workspace = true }
globset            = { workspace = true }
indexmap           = { workspace = true }
interprocess       = { workspace = true }
notify             = { workspace = true }
parking_lot        = { workspace = true }
rustix             = { workspace = true, features = ["fs", "process"] }
reqwest            = { workspace = true }
rustls             = { workspace = true }
ropey              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tempfile           = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
url                = { workspace = true }
which              = { workspace = true }

lsp-types = { workspace = true }

ahead-core        = { workspace = true }
ahead-rpc         = { workspace = true }
ahead-agent       = { path = "../ahead-agent" }
codex-exec-server = { workspace = true }

# proxy specific dependencies

dyn-clone    = "1.0.16"
fs4          = "0.13.1"
jsonrpc-lite = "0.6.0"
polling      = "3.5.0"
libc         = "0.2"
libsql       = { version = "0.6.0", default-features = false, features = ["core"] }
tokio        = { version = "1.38", features = ["rt", "rt-multi-thread", "sync", "macros"] }
uuid         = { version = "1.5", features = ["v4", "serde"] }
sha2         = "0.10"
rcgen        = "=0.14.10"

# deleting files
trash = "3.0.6"

[dependencies.ahead-extension-host]
path = "../ahead-extension-host"

[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3"

[dev-dependencies]
ahead-agent = { path = "../ahead-agent", features = ["test-support"] }
zstd = { workspace = true }

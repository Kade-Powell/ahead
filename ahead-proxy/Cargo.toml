[package]
name         = "ahead-proxy"
license      = { workspace = true }
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
alacritty_terminal = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
chrono             = { workspace = true }
crossbeam-channel  = { workspace = true }
directories        = { workspace = true }
git2               = { workspace = true }
globset            = { workspace = true }
indexmap           = { workspace = true }
interprocess       = { workspace = true }
notify             = { workspace = true }
parking_lot        = { workspace = true }
regex              = { workspace = true }
reqwest            = { workspace = true }
ropey              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-log        = { workspace = true }
url                = { workspace = true }

lsp-types = { workspace = true }

ahead-core        = { workspace = true }
ahead-rpc         = { workspace = true }
ahead-harness     = { path = "../ahead-harness" }
ahead-viewmodel   = { path = "../ahead-viewmodel" }
# proxy specific dependencies

dyn-clone    = "1.0.16"
jsonrpc-lite = "0.6.0"
polling      = "3.5.0"
libc         = "0.2"
libsql       = { version = "0.6.0", default-features = false, features = ["core"] }
tokio        = { version = "1.38", features = ["rt", "rt-multi-thread", "sync", "macros"] }
uuid         = { version = "1.5", features = ["v4", "serde"] }
sha2         = "0.10"

# deleting files
trash = "3.0.6"

# search
ignore        = "0.4"
grep-searcher = "0.1"
grep-matcher  = "0.1"
grep-regex    = "0.1"

# wasm (volt plugin hosting removed; see TODO extension-host item)

[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3"

[[bin]]
name = "ahead-proxy"
path = "src/bin/ahead-proxy.rs"

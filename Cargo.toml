[package]
name         = "ahead"
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
build = "build.rs"
default-run  = "ahead"

[dependencies]
ahead-app = { path = "./ahead-app" }
ahead-proxy = { path = "./ahead-proxy" }

[[bin]]
name = "ahead"
path = "ahead-app/src/bin/ahead.rs"

[workspace]
members = [
    "ahead-app",
    "ahead-voice",
    "ahead-proxy",
    "ahead-rpc",
    "ahead-core",
    "ahead-extension-host",
    "ahead-viewmodel",
    "ahead-agent",
    "ahead-tool-records",
    "ahead-agent/runtime/source/core",
    "ahead-agent/runtime/source/protocol",
]
default-members = [
    ".",
    "ahead-app",
    "ahead-voice",
    "ahead-proxy",
    "ahead-rpc",
    "ahead-core",
    "ahead-extension-host",
    "ahead-viewmodel",
    "ahead-agent",
]

[workspace.lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "deny", priority = -1 }
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
macro_use_extern_crate = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
disallowed-types = "deny"
disallowed-methods = "deny"
wildcard_imports = "deny"
expect_used = "deny"
missing_panics_doc = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
collapsible_else_if = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
if_not_else = "deny"
ignored_unit_patterns = "deny"
inconsistent_struct_constructor = "deny"
manual_assert = "deny"
manual_let_else = "deny"
manual_string_new = "deny"
match_bool = "deny"
match_wildcard_for_single_variants = "deny"
range_plus_one = "deny"
redundant_else = "deny"
search_is_some = "deny"
semicolon-if-nothing-returned = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
let_underscore_must_use = "deny"
stable_sort_primitive = "deny"
unused_async = "deny"
ref_option = "deny"
trivially_copy_pass_by_ref = "deny"
unnecessary_literal_bound = "deny"
unnecessary_wraps = "deny"
unused_self = "deny"
dbg_macro = "deny"
needless_raw_string_hashes = "deny"
or_fun_call = "deny"
print_stderr = "deny"
print_stdout = "deny"
uninlined_format_args = "deny"
default_trait_access = "allow"
doc_lazy_continuation = "allow"
match_same_arms = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
if_then_some_else_none = "deny"
needless_collect = "deny"
redundant_clone = "deny"
unused_result_ok = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.87.0"
license      = "Apache-2.0"
homepage     = "https://github.com/Kade-Powell/ahead"
authors      = ["Dongdong Zhou <dzhou121@gmail.com>"]

[workspace.dependencies]
anyhow            = { version = "1.0" }
chrono            = { version = "0.4" }

strum             = { version = "0.27.1" }
strum_macros      = { version = "0.28" }
thiserror         = { version = "2" }
toml              = { version = "0.9.11" }
url               = { version = "2.5.0" }
wasmtime          = { version = "48", default-features = false, features = [
    "anyhow",
    "async",
    "demangle",
    "runtime",
    "cranelift",
    "component-model",
    "incremental-cache",
    "parallel-compilation",

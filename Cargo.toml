rev = "cacdb5bb3b72bad2c729227537979d95af75978f"

[profile.release-lto]
inherits      = "release"
lto           = true
codegen-units = 1

# A profile which compiles all (non-workspace) dependencies in release mode
# but Ahead code in dev mode. This gives a good debugging experience for your
# code and fast performance of other people's code. After the initial
# build subsequent ones are as fast as dev mode builds.
# See https://doc.rust-lang.org/cargo/reference/profiles.html
# To use this profile:
#   cargo build --profile fastdev
#   cargo run --profile fastdev -p ahead --bin ahead
[profile.fastdev.package."*"]
opt-level = 3

[profile.dev]
debug = 1

# The imported native loop makes test binaries large. Limited debug info keeps
# backtraces useful while avoiding slow links and oversized unwind sections.
[profile.test]
debug = "limited"
incremental = false

[profile.fastdev]
inherits = "dev"

# default bacon configuration for Ahead
# `bacon` (default job) = fast check loop; `bacon run` / `bacon test` below.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "-p", "ahead", "--bin", "ahead"]
need_stdout = false
watch = ["ahead-app", "ahead-proxy", "ahead-rpc", "ahead-core", "ahead-viewmodel", "ahead-agent", "ahead-tool-records"]

[jobs.check-all]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false
watch = ["ahead-app", "ahead-proxy", "ahead-rpc", "ahead-core", "ahead-viewmodel", "ahead-agent", "ahead-tool-records"]

[jobs.test]
command = ["cargo", "test", "-p", "ahead-agent", "-p", "ahead-proxy", "-p", "ahead-viewmodel"]
need_stdout = true
watch = ["ahead-agent", "ahead-proxy", "ahead-rpc", "ahead-viewmodel", "ahead-tool-records"]

[jobs.run]
command = ["cargo", "run", "-p", "ahead", "--bin", "ahead"]
need_stdout = false
watch = ["ahead-app", "ahead-proxy", "ahead-rpc", "ahead-core", "ahead-viewmodel", "ahead-agent", "ahead-tool-records"]
kill = ["cargo", "run", "-p", "ahead", "--bin", "ahead"]

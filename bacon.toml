# default bacon configuration for Ahead
# `bacon` (default job) = fast check loop; `bacon run` / `bacon test` below.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--bin", "ahead", "--tests"]
need_stdout = false
watch = ["ahead-app", "ahead-proxy", "ahead-rpc", "ahead-core", "ahead-viewmodel"]

[jobs.check-all]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false
watch = ["ahead-app", "ahead-proxy", "ahead-rpc", "ahead-core", "ahead-viewmodel"]

[jobs.test]
command = ["cargo", "test", "-p", "ahead-proxy", "--lib", "-p", "ahead-viewmodel"]
need_stdout = true
watch = ["ahead-proxy", "ahead-rpc", "ahead-viewmodel"]

[jobs.run]
command = ["cargo", "run", "--bin", "ahead"]
need_stdout = false
watch = ["ahead-app", "ahead-proxy", "ahead-rpc", "ahead-core", "ahead-viewmodel"]
kill = ["cargo", "run", "--bin", "ahead"]

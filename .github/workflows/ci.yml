on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Cargo.toml
      - Cargo.lock
      - ahead-**
      - justfile
      - scripts/**
      - tests/**
      - .github/workflows/ci.yml
  workflow_dispatch:

name: CI

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build:
    name: Rust on ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        if: runner.os != 'Windows'
        uses: extractions/setup-just@v4

      - name: Verify shared dev-loop lock
        if: runner.os != 'Windows'
        run: just dev-lock-smoke

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo env PATH="$PATH" just ubuntu-deps

      - name: Update toolchain & add llvm-tools
        run: |
          rustup update --no-self-update

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build Ahead and Code Mode host
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/ensure-code-mode-v8.sh
          cargo build --profile release-lto --locked -p ahead -p ahead-code-mode-host --bins

      - name: Build Ahead on Windows
        if: runner.os == 'Windows'
        run: cargo build --profile release-lto --locked -p ahead --bin ahead --bin ahead-askpass

      - name: Test Windows AGENTS.md reparse-point rejection
        if: startsWith(matrix.os, 'windows')
        run: cargo test --locked --profile release-lto -p ahead-agent --lib target_instruction_read_rejects_reparse_parent_directory

      - name: Test Windows memory flows
        if: startsWith(matrix.os, 'windows')
        run: cargo test --locked --profile release-lto -p ahead-proxy --lib memory_

      - name: Test macOS and Windows ACP package cache
        if: runner.os != 'Linux'
        run: cargo test --locked --profile release-lto -p ahead-agent --lib npx_ -- --test-threads=1

      - name: Test macOS and Windows session storage
        if: runner.os != 'Linux'
        run: cargo test --locked --profile release-lto -p ahead-proxy --lib session_storage_ -- --test-threads=1

      - name: Free space on Windows
        if: startsWith(matrix.os, 'windows')
        run: cargo clean

      - name: Build native-agent sandbox helper for tests
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          source scripts/ensure-code-mode-v8.sh
          cargo build --locked -p ahead --bin ahead

      - name: Run workspace library tests
        if: startsWith(matrix.os, 'ubuntu')
        run: RUST_TEST_THREADS=1 cargo test --locked --lib

      - name: Test retained API error context
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo test --locked -p codex-api --test ahead_error_context

      - name: Test Code Mode sidecar
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          source scripts/ensure-code-mode-v8.sh
          cargo test --locked -p ahead-code-mode-host -p ahead-code-mode-runtime

      - name: Run workspace doc tests
        run: cargo test --locked --doc

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update toolchain & add rustfmt
        run: |
          rustup update
          rustup component add rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Update toolchain & add clippy
        run: |
          rustup update --no-self-update
          rustup component add clippy

      - name: Install just
        if: startsWith(matrix.os, 'ubuntu')
        uses: extractions/setup-just@v4

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo env PATH="$PATH" just ubuntu-deps

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets

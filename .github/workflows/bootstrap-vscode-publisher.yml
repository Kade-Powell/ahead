name: Bootstrap VS Code publisher identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Print Marketplace identity ID
        run: az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

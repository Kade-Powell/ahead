name: Publish Pi extension

on:
  release:
    types: [published]

concurrency:
  group: publish-pi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'pi-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release version
        id: release
        working-directory: integrations/pi
        run: node ./scripts/check-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Install exact dependencies
        working-directory: integrations/pi
        run: npm ci

      - name: Build, test, and verify packed installation
        working-directory: integrations/pi
        run: npm test

      - name: Publish with provenance
        working-directory: integrations/pi
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"

      - name: Verify registry version
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in {1..10}; do
            actual_version="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null || true)"
            if [[ "${actual_version}" == "${PACKAGE_VERSION}" ]]; then
              echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION}"
              exit 0
            fi

            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not visible yet (attempt ${attempt}/10)"
            if [[ "${attempt}" -lt 10 ]]; then
              sleep 6
            fi
          done

          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} did not become visible in time" >&2
          exit 1

[package]
name         = "ahead-app"
autobins     = false
license      = { workspace = true }
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
ahead-voice = { path = "../ahead-voice" }
ahead-viewmodel = { path = "../ahead-viewmodel" }
ahead-rpc = { workspace = true }
ahead-core = { workspace = true }
alacritty_terminal = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
fancy-regex = { workspace = true }
gpui-kit = { workspace = true }
gpui-base = { workspace = true }
gpui-util = { workspace = true }
gpui-kit-assets = "=0.6.6"
iana-time-zone = "0.1"
log = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
fs4 = "0.13.1"
uuid = { version = "1.7", features = ["v4"] }
crossbeam-channel = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
ropey = { workspace = true }
lsp-types = { workspace = true }
serde = { workspace = true }
shlex = { workspace = true }
semver = "1.0.28"
sha2 = { workspace = true }
nucleo-matcher = { workspace = true }
parking_lot = { workspace = true }
similar = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
sysinfo = "0.31.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
ahead-proxy = { path = "../ahead-proxy", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }

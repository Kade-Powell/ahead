[package]
name         = "ahead-agent"
description  = "AHEAD-owned agent runtime integration and durable streamed sessions"
license      = { workspace = true }
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }

[features]
test-support = []

[dependencies]
anyhow            = { workspace = true }
chrono            = { workspace = true }
parking_lot       = { workspace = true }
reqwest           = { workspace = true }
regex             = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
semver            = "1.0"
toml              = { workspace = true }
tempfile          = { workspace = true }
sha2              = "0.11"
fs4               = "1.1.0"
flate2            = { workspace = true }
tar               = { workspace = true }
zip               = { workspace = true }
bzip2             = "0.6"
tracing           = { workspace = true }
url               = { workspace = true }
uuid              = { version = "1.5", features = ["v4", "serde"] }
tokio             = { version = "1.38", features = ["rt", "rt-multi-thread", "sync", "macros"] }

ahead-rpc       = { workspace = true }
ahead-core      = { workspace = true }

# Built-in agent: direct in-process hard fork. ACP is external-agent only.
codex-core     = { workspace = true }
codex-config   = { workspace = true }
codex-models-manager = { workspace = true }
ahead-agent-graph-store = { workspace = true }
codex-protocol = { workspace = true }
codex-features = { workspace = true }
codex-exec-server = { workspace = true }
codex-rollout = { workspace = true }
codex-thread-store = { workspace = true }
ahead-runtime-api = { workspace = true }
ahead-agent-skills = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
walkdir = { workspace = true }
zstd = "0.14.0"

[dev-dependencies]
codex-code-mode = { workspace = true }
codex-mcp = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
